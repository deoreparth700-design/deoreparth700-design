name: Refresh README cards

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 in India (IST is UTC+5:30)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fonttools pillow

      - name: Refresh contribution and repo data
        run: python scripts/fetch_data.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Falls back to the built-in token. If the GraphQL call is refused,
          # add a token with no scopes as a repo secret named GH_PAT.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Build subset fonts (first run only)
        run: test -f fonts/sans-800.woff || python scripts/render_readme_cards.py --build-fonts

      - name: Render README cards
        run: python scripts/render_readme_cards.py

      - name: Commit data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards fonts
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
