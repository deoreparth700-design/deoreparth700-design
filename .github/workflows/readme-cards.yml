name: Refresh README cards

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 India Standard Time (UTC+5:30)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install fonttools pillow playwright brotli

      - name: Install Chromium for Playwright
        run: python -m playwright install chromium --with-deps

      - name: Refresh contribution and repo data
        run: python scripts/fetch_data.py
        env:
          GH_USER: ${{ github.repository_owner }}
          # Falls back to the built-in token. If the GraphQL call is refused,
          # add a token with no scopes as a repo secret named GH_PAT.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Build subset fonts (first run only)
        run: |
          if [ ! -f fonts/bodoni-400.woff2 ] || [ ! -f fonts/sans-800.woff ]; then
            python scripts/render_readme_cards.py --build-fonts
          else
            echo "Fonts already present, skipping build"
          fi

      - name: Render static SVG cards
        run: python scripts/render_readme_cards.py

      - name: Generate animated GIF cards
        run: python scripts/make_gifs.py

      - name: Commit data, fonts, cards and GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards fonts gifs
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
